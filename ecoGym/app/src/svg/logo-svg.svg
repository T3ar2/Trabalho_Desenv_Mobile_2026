<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Grupo principal com formatação de cor, fonte e alinhamento centralizado -->
  <g fill="#FFFFFF" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif" font-weight="600">
    
    <!-- Linhas que formam o "X" central -->
    <line x1="175" y1="135" x2="325" y2="285" stroke="#FFFFFF" stroke-width="8" />
    <line x1="175" y1="285" x2="325" y2="135" stroke="#FFFFFF" stroke-width="8" />

    <!-- Letras posicionadas nos quadrantes do X -->
    <text x="250" y="90" font-size="70" dominant-baseline="central">E</text>
    <text x="250" y="330" font-size="70" dominant-baseline="central">O</text>
    <text x="125" y="210" font-size="70" dominant-baseline="central">G</text>
    <text x="375" y="210" font-size="70" dominant-baseline="central">V</text>

    <!-- Título inferior -->
    <text x="255" y="420" font-size="34" letter-spacing="8" dominant-baseline="central">EVO GYM</text>
  </g>
</svg>
